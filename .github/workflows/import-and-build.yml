name: Build Route Recorder APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/import-and-build.yml'

permissions:
  contents: read

concurrency:
  group: route-recorder-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure bounded Gradle memory
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          grep -vE '^(org[.]gradle[.]jvmargs|org[.]gradle[.]workers[.]max)=' gradle.properties > /tmp/gradle.properties || true
          mv /tmp/gradle.properties gradle.properties
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          EOF

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteRecorder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
